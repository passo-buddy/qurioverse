  [22,42,70].forEach((s,i)=>{const g=new THREE.Sprite(new THREE.SpriteMaterial({map:DOT,color:i===0?0xfff2d0:(i===1?0xffc46a:0xff8a4a),
    transparent:true,opacity:i===0?.8:(i===1?.4:.18),blending:THREE.AdditiveBlending,depthWrite:false}));
    g.position.set(0,6,0);g.scale.set(s,s,1);mandala.add(g);});
  const pl=new THREE.PointLight(0xffdca0,3,300,1.6);pl.position.set(0,10,0);mandala.add(pl);
  mandala.add(labelSprite(G.center.title, "#fff7e6", new THREE.Vector3(0,40,0), 1.5, true));})();

function labelSprite(txt, color, posV, scale, big){
  const c=document.createElement("canvas");c.width=1024;c.height=256;const x=c.getContext("2d");
  x.font=(big?"700 ":"600 ")+(big?92:60)+"px 'Hiragino Mincho ProN','Yu Mincho',serif";
  x.fillStyle=color;x.textAlign="center";x.textBaseline="middle";x.shadowColor="rgba(0,0,0,.95)";x.shadowBlur=18;
  x.fillText(txt,512,128);const t=new THREE.CanvasTexture(c);
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:t,transparent:true,depthTest:false,depthWrite:false}));
  s.position.copy(posV);const w=(big?70:52)*scale;s.scale.set(w,w*0.25,1);return s;}

// 配信点
const rayTargets=[],twinkle=[];
const epByAxis={};for(let i=0;i<N;i++)epByAxis[i]=[];
G.eps.forEach(e=>{
  const R=EP_IN+e.rec*(EP_OUT-EP_IN);
  const y=1.5+DOME*(1-R/EP_OUT)+Math.min(10,e.dur/9);
  const p=W(e.a,R,y);
  const sz=3.0+Math.min(7,e.dur/13);
  const col=new THREE.Color(e.color).lerp(new THREE.Color(0xffffff),0.15);
  const grp=new THREE.Group();grp.position.copy(p);
  const glow=new THREE.Sprite(new THREE.SpriteMaterial({map:DOT,color:col,transparent:true,opacity:.58,blending:THREE.AdditiveBlending,depthWrite:false}));
  glow.scale.set(sz*1.7,sz*1.7,1);grp.add(glow);
  const core=new THREE.Sprite(new THREE.SpriteMaterial({map:DOT,color:0xffffff,transparent:true,opacity:.9,blending:THREE.AdditiveBlending,depthWrite:false}));
  core.scale.set(sz*0.7,sz*0.7,1);grp.add(core);
  grp.userData={ep:e};glow.userData.owner=grp;glow.userData.ep=e;rayTargets.push(glow);
  twinkle.push({m:glow.material,base:.78,range:.24,sp:.6+Math.random()*1.3,ph:Math.random()*6.28});
  mandala.add(grp);epByAxis[e.axis].push(grp);
});

// 凡例
const leg=document.getElementById("legend"),panel=document.getElementById("panel");
G.axes.forEach((a,i)=>{const d=document.createElement("div");d.className="li";
  d.innerHTML=`<span class="sw" style="background:${a.color};color:${a.color}"></span><span>${a.motif} ${esc(a.title)} <span style="color:#6f6754">${a.count}</span></span>`;
  d.addEventListener("mouseenter",()=>focusAxis(i));d.addEventListener("mouseleave",clearAxis);leg.appendChild(d);});
function focusAxis(i){petalMeshes.forEach(m=>m.material.opacity=(m.userData.axis===i)?0.32:0.04);
  for(let k=0;k<N;k++)epByAxis[k].forEach(g=>g.children[0].material.opacity=(k===i)?.95:.12);
  const a=G.axes[i];panel.innerHTML=`<div class="pt" style="color:${a.color}">${a.motif} ${esc(a.title)}</div><div class="pe">${esc(a.essence)}</div>`;panel.style.opacity=1;}
function clearAxis(){petalMeshes.forEach(m=>m.material.opacity=m.userData.base);
  for(let k=0;k<N;k++)epByAxis[k].forEach(g=>g.children[0].material.opacity=.75);panel.style.opacity=0;}

// ホバー/クリック
const ray=new THREE.Raycaster();const mouse=new THREE.Vector2();const tip=document.getElementById("tip");
let hoverEp=null;
addEventListener("pointermove",ev=>{mouse.x=(ev.clientX/innerWidth)*2-1;mouse.y=-(ev.clientY/innerHeight)*2+1;
  ray.setFromCamera(mouse,camera);
  const h=ray.intersectObjects(rayTargets,false);
  if(h.length){const e=h[0].object.userData.ep;hoverEp=e;document.body.style.cursor="pointer";
    const ppl=e.people&&e.people.length?`<div class="tg">🎙 ${esc(e.people.join("・"))}</div>`:"";
    const tg=e.themes&&e.themes.length?`<div class="tg">${e.themes.map(t=>"#"+esc(t)).join("  ")}</div>`:"";
    tip.innerHTML=`<div class="tm">${G.axes[e.axis].motif} ${esc(G.axes[e.axis].title)} · ${e.date} · ${esc(e.durstr)}</div>`+
      `<div class="tt">${esc(e.title)}</div>`+ppl+tg+`<div class="to">クリックで配信を開く ↗</div>`;
    tip.style.opacity=1;tip.style.left=Math.min(ev.clientX+15,innerWidth-330)+"px";tip.style.top=Math.min(ev.clientY+13,innerHeight-150)+"px";
  }else{hoverEp=null;document.body.style.cursor="default";tip.style.opacity=0;
    const hp=ray.intersectObjects(petalMeshes,false);if(hp.length)focusAxis(hp[0].object.userData.axis);else clearAxis();}
});
let downXY=null;addEventListener("pointerdown",e=>downXY=[e.clientX,e.clientY]);
addEventListener("pointerup",e=>{if(!downXY)return;const mv=Math.hypot(e.clientX-downXY[0],e.clientY-downXY[1]);downXY=null;
  if(mv>6)return;if(hoverEp&&hoverEp.url&&hoverEp.url!=="#")window.open(hoverEp.url,"_blank","noopener");});

// コントロール
let spin=true;document.getElementById("spin").addEventListener("click",e=>{spin=!spin;e.target.classList.toggle("on",spin);});
document.getElementById("top").addEventListener("click",()=>animCam(new THREE.Vector3(0,330,0.1),new THREE.Vector3(0,0,0),900));
document.getElementById("png").addEventListener("click",()=>{composer.render();const a=document.createElement("a");
  a.download="sakashushu-mandala-3d.png";a.href=renderer.domElement.toDataURL("image/png");a.click();});
function animCam(tp,tt,dur){const fp=camera.position.clone(),ft=controls.target.clone(),t0=performance.now();
  const st=now=>{const f=Math.min(1,(now-t0)/dur),e=f*f*(3-2*f);camera.position.lerpVectors(fp,tp,e);
    controls.target.lerpVectors(ft,tt,e);controls.update();if(f<1)requestAnimationFrame(st);};requestAnimationFrame(st);}
addEventListener("resize",()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight);});

const clock=new THREE.Clock();
function loop(){requestAnimationFrame(loop);const t=clock.getElapsedTime();
  if(spin)mandala.rotation.y+=0.0016;
  for(let i=0;i<twinkle.length;i++){const s=twinkle[i];s.m.opacity=s.base-s.range*(0.5+0.5*Math.sin(t*s.sp+s.ph));}
  controls.update();composer.render();}
loop();app.classList.add("ready");
setTimeout(()=>animCam(new THREE.Vector3(70,258,300),new THREE.Vector3(0,6,0),2400),120);
window.qt={camera,controls,scene,mandala,bloom,setView(px,py,pz,tx,ty,tz){spin=false;camera.position.set(px,py,pz);controls.target.set(tx,ty,tz);controls.update();}};
</script>
</body></html>
