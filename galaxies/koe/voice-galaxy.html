function hsh(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return((h>>>0)%1000)/1000;}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function gauss(r){return (r()+r()+r()-1.5)/1.5;}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

// ---- 銀河のパラメータ ----
const CORE=15, RIM=176, SPIRAL=3.9, THICK=9, ARMSPREAD=0.14;
const BUCKETS=G.buckets, NARM=BUCKETS.length;
const armOf={};BUCKETS.forEach((b,i)=>armOf[b]=i);
function armBase(i){return i/NARM*Math.PI*2;}
function armColor(i){const h=((i/NARM)*0.82+0.55)%1;return new THREE.Color().setHSL(h,0.60,0.58);}
const ARMCOL=BUCKETS.map((_,i)=>armColor(i));
// 型ごとの径方向の微ニュッジ（ゲスト回はやや外・雑談はやや内）
const TYPENUDGE={note:0.05,insight:0.03,discovery:-0.01,question:-0.03};

// ---- シーン ----
const app=document.getElementById("app");
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x05060e);
scene.fog=new THREE.FogExp2(0x05060e,0.00055);
const camera=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,0.1,6000);
camera.position.set(120,320,560);
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(2,devicePixelRatio));
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=0.92;
app.appendChild(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;controls.dampingFactor=.06;controls.target.set(0,0,0);
controls.autoRotate=false;controls.minDistance=45;controls.maxDistance=1100;

// ---- ポストプロセス（Bloom）----
const composer=new EffectComposer(renderer);
composer.setPixelRatio(Math.min(2,devicePixelRatio));composer.setSize(innerWidth,innerHeight);
composer.addPass(new RenderPass(scene,camera));
const bloom=new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),0.50,0.62,0.24);
composer.addPass(bloom);
composer.addPass(new OutputPass());

// ---- テクスチャ ----
function dotTex(){const c=document.createElement("canvas");c.width=c.height=64;const x=c.getContext("2d");
  const g=x.createRadialGradient(32,32,0,32,32,32);g.addColorStop(0,"rgba(255,255,255,1)");
  g.addColorStop(.28,"rgba(255,255,255,.7)");g.addColorStop(1,"rgba(255,255,255,0)");
  x.fillStyle=g;x.fillRect(0,0,64,64);return new THREE.CanvasTexture(c);}
function burstTex(){const c=document.createElement("canvas");c.width=c.height=128;const x=c.getContext("2d");x.translate(64,64);
  const core=x.createRadialGradient(0,0,0,0,0,20);core.addColorStop(0,"rgba(255,255,255,1)");
  core.addColorStop(.5,"rgba(255,255,255,.5)");core.addColorStop(1,"rgba(255,255,255,0)");
  x.fillStyle=core;x.beginPath();x.arc(0,0,20,0,7);x.fill();
  x.globalCompositeOperation="lighter";
  for(let k=0;k<8;k++){x.save();x.rotate(k*Math.PI/4);const len=k%2?38:60;
    const g=x.createLinearGradient(0,0,0,-len);g.addColorStop(0,"rgba(255,255,255,.9)");g.addColorStop(1,"rgba(255,255,255,0)");
    x.fillStyle=g;x.beginPath();x.moveTo(-2.2,0);x.lineTo(0,-len);x.lineTo(2.2,0);x.closePath();x.fill();x.restore();}
  return new THREE.CanvasTexture(c);}
function ringTex(){const c=document.createElement("canvas");c.width=c.height=128;const x=c.getContext("2d");x.translate(64,64);
  const g=x.createRadialGradient(0,0,34,0,0,60);g.addColorStop(0,"rgba(255,255,255,0)");
  g.addColorStop(.55,"rgba(255,255,255,.5)");g.addColorStop(.72,"rgba(255,255,255,.14)");g.addColorStop(1,"rgba(255,255,255,0)");
  x.fillStyle=g;x.beginPath();x.arc(0,0,60,0,7);x.fill();return new THREE.CanvasTexture(c);}
const DOT=dotTex(),BURST=burstTex(),RING=ringTex();

// ---- 点群ユーティリティ ----
const _pointVert=`attribute float size;attribute vec3 acolor;varying vec3 vColor;uniform float att;
  void main(){vColor=acolor;vec4 mv=modelViewMatrix*vec4(position,1.);
  gl_PointSize=size*(att/max(1.0,-mv.z));gl_Position=projectionMatrix*mv;}`;
const _pointFrag=`varying vec3 vColor;
  void main(){float d=length(gl_PointCoord-vec2(0.5));float a=smoothstep(0.5,0.02,d);a=pow(a,1.5);
  if(a<0.01)discard;gl_FragColor=vec4(vColor,a);}`;
function makePoints(pos,col,sz,att,fogged){const g=new THREE.BufferGeometry();
  g.setAttribute("position",new THREE.BufferAttribute(pos,3));
  g.setAttribute("acolor",new THREE.BufferAttribute(col,3));
  g.setAttribute("size",new THREE.BufferAttribute(sz,1));
  const m=new THREE.ShaderMaterial({uniforms:{att:{value:att}},vertexShader:_pointVert,fragmentShader:_pointFrag,
    transparent:true,depthWrite:false,blending:THREE.AdditiveBlending});
  return new THREE.Points(g,m);}

// ---- 背景 ----
scene.add(new THREE.Mesh(new THREE.SphereGeometry(2600,32,20),new THREE.ShaderMaterial({
  side:THREE.BackSide,depthWrite:false,fog:false,
  uniforms:{top:{value:new THREE.Color(0x03040a)},mid:{value:new THREE.Color(0x090a1a)},bot:{value:new THREE.Color(0x0c0716)}},
  vertexShader:"varying vec3 vP;void main(){vP=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}",
  fragmentShader:"varying vec3 vP;uniform vec3 top,mid,bot;void main(){float h=normalize(vP).y;"+
    "vec3 c=h>0.0?mix(mid,top,smoothstep(0.,.8,h)):mix(bot,mid,smoothstep(-.6,0.,h));gl_FragColor=vec4(c,1.);}"
})));
(function bgstars(){const N=2600,pos=new Float32Array(N*3),col=new Float32Array(N*3),sz=new Float32Array(N),rr=mulberry32(70113);
  for(let i=0;i<N;i++){const a=rr()*Math.PI*2,e=Math.asin(rr()*2-1),R=2100+rr()*300;
    pos[i*3]=Math.cos(a)*Math.cos(e)*R;pos[i*3+1]=Math.sin(e)*R;pos[i*3+2]=Math.sin(a)*Math.cos(e)*R;
    const t=rr(),c=new THREE.Color().setHSL(.55+t*.12,.5,.6+rr()*.35);
    col[i*3]=c.r;col[i*3+1]=c.g;col[i*3+2]=c.b;sz[i]=(rr()<.06?3.2:1.3)+rr()*1.4;}
  scene.add(makePoints(pos,col,sz,240,false));})();
(function bgneb(){const NEB=nebTex();[[ -1400,300,-1500,0x3a2f7a,900],[1500,-200,-1300,0x1f4a6e,1000],
    [ -300,-600,1700,0x5a2a6a,760]].forEach(q=>{
    const s=new THREE.Sprite(new THREE.SpriteMaterial({map:NEB,color:q[3],transparent:true,opacity:.22,
      blending:THREE.AdditiveBlending,depthWrite:false,fog:false}));
    s.position.set(q[0],q[1],q[2]);s.scale.set(q[4],q[4],1);scene.add(s);});})();
function nebTex(){const c=document.createElement("canvas");c.width=c.height=256;const x=c.getContext("2d");
  const rr=mulberry32(9);for(let i=0;i<60;i++){const px=rr()*256,py=rr()*256,rad=20+rr()*90;
    const g=x.createRadialGradient(px,py,0,px,py,rad);g.addColorStop(0,`rgba(255,255,255,${.03+rr()*.05})`);
    g.addColorStop(1,"rgba(255,255,255,0)");x.fillStyle=g;x.fillRect(0,0,256,256);}
  return new THREE.CanvasTexture(c);}

// ---- 銀河グループ ----
const gGalaxy=new THREE.Group();scene.add(gGalaxy);

// 核
const coreGlows=[];
(function core(){const N=1400,pos=new Float32Array(N*3),col=new Float32Array(N*3),sz=new Float32Array(N),rr=mulberry32(555);
  for(let i=0;i<N;i++){const a=rr()*Math.PI*2,u=Math.pow(rr(),2.2),rad=u*CORE*1.7,e=gauss(rr)*CORE*0.5;
    pos[i*3]=Math.cos(a)*rad;pos[i*3+1]=e;pos[i*3+2]=Math.sin(a)*rad;
    const c=new THREE.Color().setHSL(.11,.55,.72+rr()*.25);col[i*3]=c.r;col[i*3+1]=c.g;col[i*3+2]=c.b;
    sz[i]=1.4+rr()*2.4;}
  gGalaxy.add(makePoints(pos,col,sz,260,true));
  const glows=[[30,0xfff2d0,.7],[58,0xffc46a,.4],[104,0xff7a52,.2],[168,0x6a7cff,.12]];
  glows.forEach(q=>{const s=new THREE.Sprite(new THREE.SpriteMaterial({map:DOT,color:q[1],transparent:true,opacity:q[2],
    blending:THREE.AdditiveBlending,depthWrite:false,fog:false}));s.scale.set(q[0],q[0],1);gGalaxy.add(s);coreGlows.push(s);});
  const light=new THREE.PointLight(0xffdca0,3000,600,1.6);gGalaxy.add(light);
  scene.add(new THREE.AmbientLight(0x223052,0.7));})();

// 円盤ヘイズ
(function diskHaze(){const c=document.createElement("canvas");c.width=c.height=512;const x=c.getContext("2d");
  const g=x.createRadialGradient(256,256,6,256,256,256);
  g.addColorStop(0,"rgba(255,236,200,.40)");g.addColorStop(.16,"rgba(240,190,150,.20)");
  g.addColorStop(.45,"rgba(150,140,200,.09)");g.addColorStop(.75,"rgba(90,110,180,.035)");g.addColorStop(1,"rgba(6,8,18,0)");
  x.fillStyle=g;x.fillRect(0,0,512,512);
  const m=new THREE.Mesh(new THREE.CircleGeometry(RIM*1.15,64),
    new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(c),transparent:true,opacity:.9,
      blending:THREE.AdditiveBlending,depthWrite:false,fog:false}));
  m.rotation.x=-Math.PI/2;m.position.y=-0.5;gGalaxy.add(m);})();

// ダスト星
(function dust(){const N=9000,pos=new Float32Array(N*3),col=new Float32Array(N*3),sz=new Float32Array(N),rr=mulberry32(31337);
  for(let i=0;i<N;i++){const arm=i%NARM;const t=Math.pow(rr(),1.55);
    const r=CORE*0.5+t*(RIM*1.05-CORE*0.5);
    const ang=armBase(arm)+SPIRAL*t+gauss(rr)*ARMSPREAD*(0.5+0.8*t);
    const rj=r*(1+gauss(rr)*0.05);
    pos[i*3]=Math.cos(ang)*rj;pos[i*3+2]=Math.sin(ang)*rj;
    pos[i*3+1]=gauss(rr)*THICK*(1-0.55*t)*1.25;
    const base=ARMCOL[arm].clone();const white=Math.max(0,1-t)*0.6;
    base.lerp(new THREE.Color(0xffffff),white);base.multiplyScalar(0.32+rr()*0.42);
    col[i*3]=base.r;col[i*3+1]=base.g;col[i*3+2]=base.b;
    sz[i]=(t<0.18?1.7:0.9)+rr()*1.2;}
  gGalaxy.add(makePoints(pos,col,sz,240,true));})();

// ---- ノード配置（渦状腕）----
const pos={}, byId={};
G.nodes.forEach(n=>{byId[n.id]=n;
  const rnd=mulberry32(n.seed||1);
  const b=(n.bucket in armOf)?armOf[n.bucket]:(NARM-1);
  const rec=recency(n.date),hub=Math.min(1,(n.indeg||0)/10),nud=(TYPENUDGE[n.type]||0);
  const rNorm=clamp(0.13+0.70*rec+nud-0.09*hub+(rnd()-0.5)*0.09,0.10,1.0);
  const r=CORE+rNorm*(RIM-CORE);
  const sem=(n.s[0]*0.05+n.s[2]*0.035);
  const ang=armBase(b)+SPIRAL*rNorm+(rnd()-0.5)*ARMSPREAD*(0.5+0.7*rNorm)+sem;
  const y=gauss(rnd)*THICK*(1-0.5*rNorm)+n.s[1]*3;
  pos[n.id]=new THREE.Vector3(Math.cos(ang)*r,y,Math.sin(ang)*r);
});

// ---- 名前つきの星（配信）----
const gStars=new THREE.Group();gGalaxy.add(gStars);
const rayTargets=[], twinkle=[], insightBursts=[];
const LIKE_CAP=50,LIKE_W=1.0,BRIGHT_FROM='like';   // 共鳴輝度: config で置換される既定リテラル（like 無いコーパスは尺に自動フォールバック＝byte不変）
function tintStar(hex,f){const c=new THREE.Color(hex);const w=new THREE.Color(0xffffff);
  return c.lerp(w,0.18+0.22*f);}
G.nodes.forEach(n=>{
  const p=pos[n.id];const rnd=mulberry32((n.seed>>>3)||7);const rec=recency(n.date);
  const grp=new THREE.Group();grp.position.copy(p);
  const durf=Math.min(1,(n.dur||0)/90);                                      // 尺→[0,1]（90分で上限）
  const bf=(BRIGHT_FROM==='like'&&n.like!=null)?Math.min(1,LIKE_W*Math.log1p(Math.max(0,n.like))/Math.log1p(LIKE_CAP)):durf; // 共鳴（スキ）→[0,1]。like 無ければ尺に自動フォールバック
  let baseSz=2.7+6.2*bf+Math.min(1.6,(n.indeg||0)*0.22);
  if(n.type==="note")baseSz*=1.12;else if(n.type==="question")baseSz*=0.82;else if(n.type==="insight")baseSz*=1.05;
  const scol=tintStar(COL[n.type],rec);
  const glow=new THREE.Sprite(new THREE.SpriteMaterial({map:DOT,color:scol,transparent:true,opacity:.62,
    blending:THREE.AdditiveBlending,depthWrite:false,fog:false}));
  glow.scale.set(baseSz*1.75,baseSz*1.75,1);grp.add(glow);
  const core=new THREE.Sprite(new THREE.SpriteMaterial({map:DOT,color:0xffffff,transparent:true,opacity:.85,
    blending:THREE.AdditiveBlending,depthWrite:false,fog:false}));
  core.scale.set(baseSz*0.62,baseSz*0.62,1);grp.add(core);
  if(n.type==="insight"){
    const b=new THREE.Sprite(new THREE.SpriteMaterial({map:BURST,color:scol,transparent:true,opacity:.72,
      blending:THREE.AdditiveBlending,depthWrite:false,fog:false,rotation:rnd()*6.28}));
    b.scale.set(baseSz*4,baseSz*4,1);grp.add(b);insightBursts.push(b);
  }else if(n.type==="note"){
    const ring=new THREE.Sprite(new THREE.SpriteMaterial({map:RING,color:scol,transparent:true,opacity:.28,
      blending:THREE.AdditiveBlending,depthWrite:false,fog:false}));
    ring.scale.set(baseSz*3.0,baseSz*3.0,1);grp.add(ring);
  }else if(n.type==="question"){
    const puff=new THREE.Sprite(new THREE.SpriteMaterial({map:DOT,color:0x8fb6ff,transparent:true,opacity:.22,
      blending:THREE.AdditiveBlending,depthWrite:false,fog:false}));
    puff.scale.set(baseSz*3.6,baseSz*3.6,1);grp.add(puff);
  }
  grp.userData={node:n,d:dnum(n.date)};
  glow.userData.owner=grp;glow.userData.node=n;rayTargets.push(glow);
  twinkle.push({m:glow.material,base:.9+bf*0.14,range:.26,sp:.6+rnd()*1.4,ph:hsh(n.id)*6.28});
  gStars.add(grp);
});

// ---- 光の糸 ----
const gFil=new THREE.Group();gGalaxy.add(gFil);
const filByNode={};G.nodes.forEach(n=>filByNode[n.id]=[]);
const _up=new THREE.Vector3(0,1,0);
G.edges.forEach(e=>{if(e.type==="analogous")return;const a=pos[e.from],b=pos[e.to];if(!a||!b||e.from===e.to)return;
  const mid=a.clone().lerp(b,0.5);const dist=a.distanceTo(b);
  const dir=b.clone().sub(a).normalize(),perp=dir.clone().cross(_up);
  if(perp.lengthSq()<1e-4)perp.set(1,0,0);perp.normalize();
  mid.add(perp.multiplyScalar((hsh(e.from+e.to)-0.5)*dist*0.28));mid.y+=dist*0.10;
  const cu=new THREE.CatmullRomCurve3([a,mid,b]);const pts=cu.getPoints(14);
  const g=new THREE.BufferGeometry().setFromPoints(pts);
  const col=e.type==="guest"?0x6ab0d0:0x4a86b0;const op=e.type==="guest"?.085:.05;
  const mat=new THREE.LineBasicMaterial({color:col,transparent:true,opacity:op,
    blending:THREE.AdditiveBlending,depthWrite:false});
  const line=new THREE.Line(g,mat);
  line.userData={d:Math.max(dnum(byId[e.from].date),dnum(byId[e.to].date)),base:op};
  gFil.add(line);filByNode[e.from].push(line);filByNode[e.to].push(line);});

// ---- 金の橋（analogous）----
const gBridge=new THREE.Group();gGalaxy.add(gBridge);
const bridgePulses=[];
G.edges.forEach(e=>{if(e.type!=="analogous")return;const a=pos[e.from],b=pos[e.to];if(!a||!b)return;
  const dist=a.distanceTo(b);const mid=a.clone().lerp(b,0.5);mid.y+=Math.min(70,dist*0.34+14);
  const cu=new THREE.CatmullRomCurve3([a,mid,b]);
  const line=new THREE.Mesh(new THREE.TubeGeometry(cu,40,0.35,6,false),
    new THREE.MeshBasicMaterial({color:GOLD,transparent:true,opacity:.34,blending:THREE.AdditiveBlending,depthWrite:false}));
  line.userData.d=Math.max(dnum(byId[e.from].date),dnum(byId[e.to].date));gBridge.add(line);
  const spr=new THREE.Sprite(new THREE.SpriteMaterial({map:DOT,color:0xffedbb,transparent:true,opacity:.95,
    blending:THREE.AdditiveBlending,depthWrite:false,fog:false}));
  spr.scale.set(4,4,1);line.add(spr);bridgePulses.push({cu,spr,off:hsh(e.from+e.to)});});

// ---- テーマ名ラベル ----
const gLabel=new THREE.Group();gGalaxy.add(gLabel);
function textSprite(txt,color){const c=document.createElement("canvas");c.width=512;c.height=128;const x=c.getContext("2d");
  x.font="500 42px 'Hiragino Mincho ProN','Yu Mincho',serif";try{x.letterSpacing="2px";}catch(_){}
  x.fillStyle=color;x.textAlign="center";x.textBaseline="middle";x.shadowColor="rgba(0,0,0,.9)";x.shadowBlur=12;
  x.fillText(txt,256,64);const t=new THREE.CanvasTexture(c);
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:t,transparent:true,depthTest:false,opacity:.9}));
  s.scale.set(64,16,1);return s;}
const present={};G.nodes.forEach(n=>present[n.bucket]=(present[n.bucket]||0)+1);
BUCKETS.forEach((name,i)=>{if(!present[name])return;
  const t=0.9,r=CORE+t*(RIM-CORE);const ang=armBase(i)+SPIRAL*t;
  const col="#"+ARMCOL[i].clone().lerp(new THREE.Color(0xffffff),.45).getHexString();
  const sp=textSprite(name,col);sp.position.set(Math.cos(ang)*r,12,Math.sin(ang)*r);gLabel.add(sp);});

// ---- 統計 ----
const cc=G.counts;
document.getElementById("stat").innerHTML=
  `<b>${G.nodes.length}</b> 配信／<b>${cc.edges}</b> つながり／橋 <b>${cc.analogous}</b>／腕 <b>${Object.keys(present).length}</b><br>`+
  `対話回${cc.note}・ソロ思索${cc.insight}・探究回${cc.discovery}・雑談・短信${cc.question}<br>`+
  `<span style="color:#6a76a0">渦状腕=テーマ 核からの距離=時間 輝度=尺 糸=共通テーマ</span>`;

// ---- ホバー & クリック ----
const ray=new THREE.Raycaster();const mouse=new THREE.Vector2();const tip=document.getElementById("tip");
let hiFil=[],hovered=null;
function esc(s){return(s+"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}
function pick(cx,cy){mouse.x=(cx/innerWidth)*2-1;mouse.y=-(cy/innerHeight)*2+1;ray.setFromCamera(mouse,camera);
  return ray.intersectObjects(rayTargets,false).filter(h=>h.object.userData.owner&&h.object.userData.owner.visible);}
addEventListener("pointermove",ev=>{
  const hit=pick(ev.clientX,ev.clientY);
  hiFil.forEach(l=>{l.material.opacity=l.userData.base;l.material.color.setHex(l.userData.base>=.08?0x6ab0d0:0x4a86b0);});hiFil=[];
  if(hit.length){const n=hit[0].object.userData.node;hovered=n;document.body.style.cursor="pointer";
    (filByNode[n.id]||[]).forEach(l=>{if(l.visible){l.material.opacity=.62;l.material.color.setHex(0x9fe6d4);hiFil.push(l);}});
    const tags=(n.themes&&n.themes.length)?`<div class="t-tags">${n.themes.slice(0,6).map(t=>"#"+esc(t)).join("  ")}</div>`:"";
    const ppl=(n.people&&n.people.length)?`<div class="t-ppl">🎙 ${esc(n.people.slice(0,4).join("・"))}</div>`:"";
    tip.innerHTML=`<div class="t-type">${TYPEJA[n.type]||n.type} · ${n.date||""} · ${esc(n.durstr||"")}</div>`+
      `<div class="t-title">${esc(n.title||n.id)}</div>`+ppl+tags+
      `<div class="t-open">クリックで配信を開く ↗</div>`;
    tip.style.opacity=1;tip.style.left=Math.min(ev.clientX+16,innerWidth-350)+"px";
    tip.style.top=Math.min(ev.clientY+14,innerHeight-160)+"px";
  }else{hovered=null;document.body.style.cursor="default";tip.style.opacity=0;}
});
// クリックで配信ページを開く（ドラッグと区別: 押下位置から動いていない時のみ）
let downXY=null;
addEventListener("pointerdown",ev=>{downXY=[ev.clientX,ev.clientY];});
addEventListener("pointerup",ev=>{if(!downXY)return;const moved=Math.hypot(ev.clientX-downXY[0],ev.clientY-downXY[1]);downXY=null;
  if(moved>6)return;const hit=pick(ev.clientX,ev.clientY);
  if(hit.length){const n=hit[0].object.userData.node;if(n&&n.url)window.open(n.url,"_blank","noopener");}});

// ---- 時をまわす ----
const slider=document.getElementById("time"),seedt=document.getElementById("seedt");
function setReveal(f){const cut=DMIN+(DMAX-DMIN)*f+0.5;
  gStars.children.forEach(m=>m.visible=m.userData.d<=cut);
  gFil.children.forEach(m=>m.visible=showFil&&m.userData.d<=cut);
  gBridge.children.forEach(m=>m.visible=showBridge&&m.userData.d<=cut);
  seedt.textContent=f>=0.999?"現在":approxDate(cut);}
function approxDate(num){const y=Math.floor(num/372);const m=Math.min(12,Math.max(1,Math.floor((num-y*372)/31)));return `${y}.${String(m).padStart(2,"0")}`;}
slider.addEventListener("input",()=>{stopPlay();setReveal(slider.value/1000);});
let playing=null;
function stopPlay(){if(playing){cancelAnimationFrame(playing);playing=null;document.getElementById("play").textContent="▶ 時をまわす";}}
document.getElementById("play").addEventListener("click",()=>{if(playing){stopPlay();return;}
  document.getElementById("play").textContent="⏸ 停止";const t0=performance.now(),dur=9000;
  const step=now=>{const f=Math.min(1,(now-t0)/dur);slider.value=Math.round(f*1000);setReveal(f);
    if(f<1)playing=requestAnimationFrame(step);else stopPlay();};playing=requestAnimationFrame(step);});

// ---- トグル ----
let showBridge=true,showFil=true,spin=true;
document.getElementById("bridges").addEventListener("click",e=>{showBridge=!showBridge;
  e.target.classList.toggle("on",showBridge);setReveal(slider.value/1000);});
document.getElementById("filaments").addEventListener("click",e=>{showFil=!showFil;
  e.target.classList.toggle("on",showFil);setReveal(slider.value/1000);});
document.getElementById("labels").addEventListener("click",e=>{gLabel.visible=!gLabel.visible;e.target.classList.toggle("on",gLabel.visible);});
document.getElementById("spin").addEventListener("click",e=>{spin=!spin;e.target.classList.toggle("on",spin);});
let faceon=false;
document.getElementById("faceon").addEventListener("click",e=>{faceon=!faceon;e.target.classList.toggle("on",faceon);
  bloom.strength=faceon?0.5:0.90;
  const to=faceon?new THREE.Vector3(0,470,0.1):new THREE.Vector3(40,170,340);
  animCam(to,new THREE.Vector3(0,0,0),900);});
function animCam(toPos,toTgt,dur){const fp=camera.position.clone(),ft=controls.target.clone(),t0=performance.now();
  const step=now=>{const f=Math.min(1,(now-t0)/dur),e=f*f*(3-2*f);
    camera.position.lerpVectors(fp,toPos,e);controls.target.lerpVectors(ft,toTgt,e);controls.update();
    if(f<1)requestAnimationFrame(step);};requestAnimationFrame(step);}
document.getElementById("png").addEventListener("click",()=>{composer.render();
  const a=document.createElement("a");a.download="michinori-galaxy.png";a.href=renderer.domElement.toDataURL("image/png");a.click();});

addEventListener("resize",()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight);});

// ---- ループ ----
const clock=new THREE.Clock();
function loop(){requestAnimationFrame(loop);const t=clock.getElapsedTime();
  if(spin)gGalaxy.rotation.y+=0.00075;
  for(let i=0;i<twinkle.length;i++){const s=twinkle[i];s.m.opacity=s.base-s.range*(0.5+0.5*Math.sin(t*s.sp+s.ph));}
  for(let i=0;i<insightBursts.length;i++){insightBursts[i].material.rotation+=0.006;}
  for(let i=0;i<coreGlows.length;i++){const b=1+0.05*Math.sin(t*0.8+i);
    coreGlows[i].scale.setX(coreGlows[i].userData.s0||(coreGlows[i].userData.s0=coreGlows[i].scale.x));
    coreGlows[i].scale.set(coreGlows[i].userData.s0*b,coreGlows[i].userData.s0*b,1);}
  for(let i=0;i<bridgePulses.length;i++){const g=bridgePulses[i];g.spr.position.copy(g.cu.getPoint((t*0.05+g.off)%1));}
  controls.update();composer.render();}
loop();
setReveal(1);
app.classList.add("ready");
setTimeout(()=>animCam(new THREE.Vector3(40,170,340),new THREE.Vector3(0,0,0),2800),150);
window.qt={camera,controls,scene,gGalaxy,bloom,setView(px,py,pz,tx,ty,tz){controls.autoRotate=false;spin=false;
  camera.position.set(px,py,pz);controls.target.set(tx,ty,tz);controls.update();}};
</script>
</body></html>
