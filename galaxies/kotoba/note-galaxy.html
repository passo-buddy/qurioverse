<body>
<div id="app"></div>
<div id="vig"></div>
<div class="hud">
  <div class="title">ことばの銀河<small>NOTE GALAXY · 書いたものの渦</small></div>

  <div class="stat" id="stat"></div>
  <div class="legend">

    <span><i class="dot" style="background:#f2ca6b;color:#f2ca6b"></i>橋</span>
  </div>
</div>
<div id="tip"></div>
<div class="controls">
  <button id="play">▶ 時をまわす</button>
  <input type="range" id="time" min="0" max="1000" value="1000">
  <span id="seedt">現在</span>
  <button id="spin" class="on">◎ 自転</button>
  <button id="bridges" class="on">橋</button>
  <button id="filaments" class="on">光の糸</button>
  <button id="labels" class="on">テーマ名</button>
  <button id="faceon">俯瞰</button>
  <button id="png">PNG</button>
</div>
<div class="hint">ドラッグ=回転 / ホイール=ズーム / 右ドラッグ=移動 / 星にホバー=記事 / クリック=記事を開く</div>
