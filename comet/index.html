/* 問いの彗星（内部）— 訪問者と共に描く「声の群れ」= murmuration。

/* ============================================================

async function apiGetQuestion() {
  // 問い文は公開静的データ（questions.json）が真実源。入口から渡された cometId の問いを表示。
  try {
    const r = await fetch(`../questions.json`, { cache: "no-cache" });
    const data = await r.json(); const all = Array.isArray(data) ? data : (data.questions || []);
    const q = all.find((x) => x.id === cometId && x.kind === "comet");
    if (q && q.text) return q.text;
  } catch { /* fail-open */ }
  return MOCK.question[cometId] || MOCK.question.c1;
}
async function apiGetApproved() {
  if (!API_BASE) return MOCK.approved.slice();   // 試作モード(API_BASE 未設定)のみモック
  try {
    const r = await fetch(`${API_BASE}/api/comments?comet=${encodeURIComponent(cometId)}&limit=500`, { cache: "no-cache" });
    if (!r.ok) throw 0; const j = await r.json(); return (j.items || []);
  } catch { return []; } // fail-open: 不達なら空の静けさで退避（偽の声を本物として見せない）
}
async function apiPost(body, nickname, turnstileToken) {
  if (!API_BASE) { await new Promise((r) => setTimeout(r, 400)); return { id: "local-" + Date.now(), status: "pending" }; }
  const r = await fetch(`${API_BASE}/api/comments`, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ cometId, body, nickname, turnstileToken }),
  });
  if (!r.ok) throw new Error("post failed " + r.status);
  return r.json();
}

/* ---- Cloudflare Turnstile（本番のみ・sitekey 設定時に不可視CAPTCHAを出す） ---- */
let turnstileToken = null, turnstileWidget = null;
function initTurnstile() {
  if (!TURNSTILE_SITEKEY) return;                       // 試作: プレースホルダのまま
  const slot = document.getElementById("turnstile-slot");
  slot.textContent = "";
  const s = document.createElement("script");
  s.src = "https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit";
  s.async = true; s.defer = true;
  s.onload = () => {
    turnstileWidget = window.turnstile.render(slot, {
      sitekey: TURNSTILE_SITEKEY, action: "post-comment", theme: "dark",
      callback: (tok) => { turnstileToken = tok; },
      "expired-callback": () => { turnstileToken = null; },
      "error-callback": () => { turnstileToken = null; },
    });
  };
  document.head.appendChild(s);
}

/* ============================================================
   three.js — 氷核の内側 + 声の murmuration
   ============================================================ */
const canvas = document.getElementById("scene");
let comments = [];

function glowTex(rgb, midStop = 0.32) {
  const c = document.createElement("canvas"); c.width = c.height = 128;
  const g = c.getContext("2d"); const gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  gr.addColorStop(0, `rgba(${rgb},1)`); gr.addColorStop(midStop, `rgba(${rgb},0.32)`); gr.addColorStop(1, `rgba(${rgb},0)`);
  g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hashStr(s){let h=2166136261>>>0;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}

let renderer, scene, camera, composer, TEX_ICE, TEX_TEAL;
const particles = []; // {id, body, nickname, x,y,z, vx,vy,vz, seed, sx,sy, spr}
let sprites = null;    // THREE.Points
let sproutSprites = []; // 私的な芽（このセッションだけ）
const ndc = new THREE.Vector2(-2, -2); const mouse = { px: -9999, py: -9999 };
let hovered = null;

function initGL() {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  scene = new THREE.Scene();
  scene.background = new THREE.Color(BG);
  scene.fog = new THREE.FogExp2(BG, 0.0032);
  camera = new THREE.PerspectiveCamera(58, innerWidth / innerHeight, 0.1, 2000);
  camera.position.set(0, 0, 96);
  TEX_ICE = glowTex("223,242,255"); TEX_TEAL = glowTex("111,214,208");

  // 氷核の内側の気配（大きな淡いティールの霧殻 + うっすら核）
  const shell = new THREE.Sprite(new THREE.SpriteMaterial({ map: TEX_TEAL, color: DEEP, transparent: true, opacity: 0.10, blending: THREE.AdditiveBlending, depthWrite: false }));
  shell.scale.set(340, 340, 1); scene.add(shell);
  const core = new THREE.Sprite(new THREE.SpriteMaterial({ map: TEX_ICE, color: TEAL, transparent: true, opacity: 0.06, blending: THREE.AdditiveBlending, depthWrite: false }));
  core.scale.set(140, 140, 1); core.position.set(0, 0, -30); scene.add(core);

  // 微細な氷塵（背景の奥行き・非対話）
  const dustN = 420, dg = new THREE.BufferGeometry(), dp = new Float32Array(dustN * 3);
  const dr = mulberry32(0x1ce);
  for (let i = 0; i < dustN; i++) { dp[i*3]=(dr()-0.5)*420; dp[i*3+1]=(dr()-0.5)*300; dp[i*3+2]=(dr()-0.5)*420-40; }
  dg.setAttribute("position", new THREE.BufferAttribute(dp, 3));
  scene.add(new THREE.Points(dg, new THREE.PointsMaterial({ size: 0.7, map: TEX_ICE, color: ICE, transparent: true, opacity: 0.5, blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true })));

  composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene, camera));
  composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.9, 0.7, 0.12));
  composer.addPass(new OutputPass());
  addEventListener("resize", () => {
    camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight);
  });
}

// 各コメント=1粒子。氷核の中に配置し、フロー場でゆっくり蠢く（murmuration）。
function buildSwarm(list) {
  particles.length = 0;
  for (const c of list) {
    const r = mulberry32(hashStr(c.id));
    const ang = r() * Math.PI * 2, rad = 14 + r() * 40, yy = (r() - 0.5) * 54;
    particles.push({
      id: c.id, body: c.body, nickname: c.nickname || "",
      x: Math.cos(ang) * rad, y: yy, z: Math.sin(ang) * rad - 6,
      vx: 0, vy: 0, vz: 0, seed: r() * 6.28, sx: -9, sy: -9, pinned: false,
    });
  }
  const n = particles.length, g = new THREE.BufferGeometry();
  const pos = new Float32Array(n * 3), col = new Float32Array(n * 3);
  const cIce = new THREE.Color(ICE), cTeal = new THREE.Color(TEAL);
  for (let i = 0; i < n; i++) {
    const m = mulberry32(hashStr(particles[i].id) ^ 0x51ed)(); const c = cIce.clone().lerp(cTeal, 0.25 + m * 0.6);
    col[i*3]=c.r; col[i*3+1]=c.g; col[i*3+2]=c.b;
  }
  g.setAttribute("position", new THREE.BufferAttribute(pos, 3));
  g.setAttribute("color", new THREE.BufferAttribute(col, 3));
  if (sprites) { scene.remove(sprites); sprites.geometry.dispose(); }
  sprites = new THREE.Points(g, new THREE.PointsMaterial({
    size: 3.6, map: TEX_TEAL, vertexColors: true, transparent: true, opacity: 0.95,
    blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true,
  }));
  scene.add(sprites);
}

// フロー場（擬似カール）＝リーダー不在の有機的な蠢き。すべて遅い。
function flow(p, t) {
  const a = 0.045, b = 0.038, s = 0.6;
  return [
    (Math.sin(p.y * a + t * 0.13 + p.seed) + Math.sin(p.z * b - t * 0.09)) * s,
    (Math.sin(p.z * a + t * 0.11) + Math.sin(p.x * b - t * 0.12 + p.seed)) * s,
    (Math.sin(p.x * a + t * 0.10) + Math.sin(p.y * b - t * 0.14)) * s,
  ];
}

const clock = new THREE.Clock();
const proj = new THREE.Vector3();
function frame() {
  const t = clock.getElapsedTime();
  const n = particles.length; const posAttr = sprites && sprites.geometry.getAttribute("position");
  for (let i = 0; i < n; i++) {
    const p = particles[i];
    const [fx, fy, fz] = flow(p, t);
    // フロー + 中心へごく弱い束縛（氷核から出ない）+ 減衰
    p.vx += fx * 0.0016 - p.x * 0.00022; p.vy += fy * 0.0016 - p.y * 0.00030; p.vz += fz * 0.0016 - (p.z + 6) * 0.00022;
    p.vx *= 0.96; p.vy *= 0.96; p.vz *= 0.96;
    p.x += p.vx; p.y += p.vy; p.z += p.vz;
    if (posAttr) { posAttr.array[i*3]=p.x; posAttr.array[i*3+1]=p.y; posAttr.array[i*3+2]=p.z; }
    // スクリーン投影（ホバー判定用）
    proj.set(p.x, p.y, p.z).project(camera);
    p.sx = (proj.x * 0.5 + 0.5) * innerWidth; p.sy = (-proj.y * 0.5 + 0.5) * innerHeight;
  }
  if (posAttr) posAttr.needsUpdate = true;
  // 私的な芽（このセッションだけ・金でそっと灯る）
  for (const s of sproutSprites) { s.material.opacity = 0.5 + 0.3 * Math.sin(t * 0.9 + s.userData.ph); const b = 6 + Math.sin(t*0.5+s.userData.ph); s.scale.set(b, b, 1); }
  // カメラの微かなドリフト（吸い込まれた後の内部の呼吸）
  camera.position.x = Math.sin(t * 0.05) * 6; camera.position.y = Math.sin(t * 0.037) * 4; camera.lookAt(0, 0, -6);
  updateHover();
  composer.render();
  if (!REDUCED) requestAnimationFrame(frame);
}

/* ---- ホバー/タップで声に触れる ---- */
const tipEl = document.getElementById("voice-tip");
function updateHover() {
  let best = null, bd = 30 * 30;
  for (const p of particles) {
    const dx = p.sx - mouse.px, dy = p.sy - mouse.py, d = dx*dx + dy*dy;
    if (d < bd) { bd = d; best = p; }
  }
  if (best !== hovered) {
    hovered = best; canvas.style.cursor = best ? "pointer" : "default";
    if (best) {
      tipEl.querySelector(".body").textContent = best.body;            // textContent（XSS 防御）
      tipEl.querySelector(".who").textContent = best.nickname ? "— " + best.nickname : "— 観測者";
      tipEl.classList.add("show"); tipEl.setAttribute("aria-hidden", "false");
    } else { tipEl.classList.remove("show"); tipEl.setAttribute("aria-hidden", "true"); }
  }
  if (hovered) { tipEl.style.left = hovered.sx + "px"; tipEl.style.top = (hovered.sy - 28) + "px"; }
}
addEventListener("pointermove", (e) => { mouse.px = e.clientX; mouse.py = e.clientY; });
addEventListener("pointerdown", (e) => { mouse.px = e.clientX; mouse.py = e.clientY; });

/* ---- 私的な芽を1つ生む（承認前・投稿者だけに見える） ---- */
function spawnSprout() {
  // 私的・非公開なので決定論は不要。乱数を使わず時刻で散らす（座席非依存）
  const ph = (Date.now() % 6283) / 1000;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: TEX_ICE, color: SPROUT, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false }));
  s.position.set(Math.sin(ph) * 10, Math.cos(ph) * 8, 8); s.userData.ph = ph; s.scale.set(6, 6, 1);
  scene.add(s); sproutSprites.push(s);
}

/* ---- 静的フォールバック（reduced-motion / SR）---- */
function renderStatic(list) {
  const box = document.getElementById("static-voices");
  for (const c of list) {
    const p = document.createElement("p"); p.className = "sv";
    p.textContent = c.body;                                            // textContent
    if (c.nickname) { const w = document.createElement("span"); w.className = "who"; w.textContent = "  — " + c.nickname; p.appendChild(w); }
    box.appendChild(p);
  }
}

/* ============================================================
   起動
   ============================================================ */
async function boot() {
  const qtext = await apiGetQuestion();
  document.getElementById("q-text").textContent = qtext;
  comments = await apiGetApproved();
  document.getElementById("q-count").textContent = comments.length ? `${comments.length} の声がめぐっている` : "まだ、声は届いていない";
  renderStatic(comments);
  initTurnstile();                                                    // 投稿ゲート（本番のみ・reduced でも投稿は可能）
  if (REDUCED) return;                                                // 静止した宇宙は静的表示のみ
  initGL(); buildSwarm(comments); frame();
}
boot();

/* ---- 投稿パネル ---- */
const compose = document.getElementById("compose"), toggle = document.getElementById("compose-toggle");
const body = document.getElementById("c-body"), nick = document.getElementById("c-nick");
const sendBtn = document.getElementById("c-send"), sprout = document.getElementById("c-sprout"), ccount = document.getElementById("c-count");
function openCompose(o) { compose.classList.toggle("open", o); toggle.setAttribute("aria-expanded", o ? "true" : "false"); if (o) body.focus(); }
toggle.addEventListener("click", () => openCompose(!compose.classList.contains("open")));
document.getElementById("compose-close").addEventListener("click", () => openCompose(false));
body.addEventListener("input", () => { ccount.textContent = `${body.value.length} / 280`; });

sendBtn.addEventListener("click", async () => {
  const text = body.value.trim(), name = nick.value.trim();
  if (text.length < 2) { body.focus(); return; }
  if (TURNSTILE_SITEKEY && !turnstileToken) {                          // 本番: 確認が済むまで送らせない
    sprout.textContent = "送信の前に、確認にチェックを入れてください。"; sprout.classList.add("show"); return;
  }
  sendBtn.disabled = true;
  try {
    const res = await apiPost(text, name, turnstileToken);             // サーバが Turnstile を siteverify
    if (res && res.status === "pending") {
      body.value = ""; ccount.textContent = "0 / 280";
      sprout.textContent = "あなたの声は、私的な芽として灯りました。夜のあいだに確かめられて、宇宙へ加わります。";
      sprout.classList.add("show");
      if (!REDUCED && scene) spawnSprout();
    }
  } catch {
    sprout.textContent = "うまく届きませんでした。少し時間をおいて、もう一度ためしてください。";
    sprout.classList.add("show");
  } finally {
    sendBtn.disabled = false;
    // Turnstile トークンは単回使用 → 送信後にリセット
    if (TURNSTILE_SITEKEY && window.turnstile && turnstileWidget != null) { window.turnstile.reset(turnstileWidget); turnstileToken = null; }
  }
});
</script>
